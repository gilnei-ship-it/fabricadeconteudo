<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Controle - Fábrica de Conteúdo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mobile-container">
        <div class="logos" style="margin-bottom: 40px;">
            <span class="logo-text logo-blue">uni</span><span class="logo-text logo-orange">brisa</span>
        </div>

        <div id="login-screen">
            <input type="text" id="code-input" placeholder="CÓDIGO DA TV" maxlength="4" style="text-transform: uppercase;">
            <input type="text" id="name-input" placeholder="Seu Nome">
            <button id="join-btn">ENTRAR NA SALA</button>
        </div>

        <div id="waiting-screen" class="hidden">
            <h2 style="color: var(--unibrisa-blue);">Conectado!</h2>
            <p style="margin-top: 10px;">Olhe para a TV e aguarde o Host iniciar.</p>
        </div>

        <div id="game-screen" class="hidden">
            <button id="action-btn">GERAR<br>VÍDEOS!</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="player.js"></script>
</body>
</html>
